# Single-file setup: only the project image. Credentials live in Supabase
# Postgres, routing/TLS is handled by the global Caddy on this server.
#
#   Machine harnesses (codex/claude): https://ai.tunly.cloud/v1  (Bearer api-key)
#   Account UI:                        https://accounts.tunly.cloud/ (Cloudflare Access)
#
# Usage on any machine:
#   1. Global Caddy must exist with an external `web` network
#      (docker network create web   -- if it does not exist yet).
#   2. cp .env.example .env   # then set PGSTORE_DSN (Supabase, see .env.example)
#   3. Global Caddy already routes ai.tunly.cloud (API paths only) and
#      accounts.tunly.cloud (UI only) to http://cliproxy-api:8317.
#   4. docker compose up -d
#      (pulls ghcr.io/ahmadjavaiddev/cli-proxy-api:latest, bootstraps the DB
#      schema + default config on first boot against an empty database.)
#   5. Open the UI host, set api-keys + secret-key (Management), upload the
#      existing auth JSONs, set trusted-proxies (see config.example.yaml).
#   6. Zero Trust dashboard: Require login on the UI host, Bypass (or no app)
#      on the API host.
#
# Security: port 8317 is intentionally NOT published. Only the global Caddy
# (same `web` network) reaches it, which is what makes `trusted-proxies` safe.

services:
  api:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/ahmadjavaiddev/cli-proxy-api:latest}
    pull_policy: always
    container_name: cliproxy-api
    environment:
      # Supabase: use the DIRECT connection string (db.<ref>.supabase.co:5432,
      # sslmode=require), NOT the transaction-mode pooler (port 6543), because the
      # bootstrap needs a session-level connection.
      PGSTORE_DSN: ${PGSTORE_DSN:?set PGSTORE_DSN in .env}
      PGSTORE_SCHEMA: ${PGSTORE_SCHEMA:-public}
      PGSTORE_LOCAL_PATH: /var/lib/cliproxy
    volumes:
      # Spool mirrors DB content locally at runtime. It also holds
      # .account-vault.json (file-based, next to the spooled config),
      # so keep this volume or re-enter vault credentials after moves.
      - cliproxy-spool:/var/lib/cliproxy
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
    expose:
      - "8317"
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8317/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  web:
    external: true

volumes:
  cliproxy-spool:
