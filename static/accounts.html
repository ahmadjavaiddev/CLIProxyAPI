<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0f0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Account quota board</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      font-feature-settings: "cv11", "ss01";
      --canvas: #0d0f0f;
      --surface: #151817;
      --surface-muted: #1c201e;
      --surface-hover: #191d1b;
      --text: #f2f5f3;
      --muted: #a7afaa;
      --faint: #77807a;
      --line: #29302c;
      --line-strong: #3a443f;
      --accent: #22b584;
      --accent-hover: #2ac491;
      --accent-soft: #12362a;
      --on-accent: #07110d;
      --danger: #ff7168;
      --danger-soft: #351b1b;
      --danger-border: #6b302f;
      --warning: #d6a23c;
      --warning-soft: #342a13;
      --warning-border: #66501f;
      --focus: #49cfa1;
      --track: #29302c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    button, input, select { font: inherit; }
    button { touch-action: manipulation; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 30%, transparent);
      outline-offset: 2px;
    }

    .shell {
      width: min(1320px, calc(100% - 48px));
      margin: 0 auto;
      padding: 42px 0 64px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.15;
      letter-spacing: -.025em;
    }

    .lede {
      max-width: 62ch;
      margin: 9px 0 0;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .button {
      min-height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      font-weight: 650;
      text-decoration: none;
      box-shadow: var(--shadow);
    }

    .button:hover { background: var(--surface-muted); }
    .button:disabled { cursor: wait; opacity: .58; }
    .button.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
    .button.primary:hover { background: var(--accent-hover); }
    .button.danger { border-color: var(--danger-border); color: var(--danger); box-shadow: none; }
    .button.danger:hover { background: var(--danger-soft); }
    .button.small { min-height: 36px; padding: 6px 10px; font-size: 13px; }

    .icon {
      width: 17px;
      height: 17px;
      flex: none;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .statusbar {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      margin: 24px 0 30px;
      border-block: 1px solid var(--line);
    }

    .metric {
      padding: 18px 20px;
      border-right: 1px solid var(--line);
    }

    .metric:first-child { padding-left: 0; }
    .metric:last-child { border-right: 0; }
    .metric-label { color: var(--muted); font-size: 12px; font-weight: 650; }
    .metric-value { margin-top: 3px; font-size: 21px; font-weight: 700; letter-spacing: -.015em; }
    .online { display: inline-flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
    .dot.ok { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    h2 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
    .hint { margin: 3px 0 0; color: var(--muted); font-size: 13px; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 190px 190px auto;
      align-items: end;
      gap: 10px;
      margin: 18px 0 12px;
    }
    .control label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .search-control { position: relative; }
    .search-control .icon {
      position: absolute;
      left: 12px;
      bottom: 12px;
      color: var(--muted);
      pointer-events: none;
    }
    .control input,
    .control select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 8px 11px;
    }
    .search-control input { padding-left: 38px; }
    .control input::placeholder { color: var(--faint); }
    .result-count {
      min-width: 94px;
      padding: 10px 0;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      white-space: nowrap;
    }

    .account-list {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .account {
      display: grid;
      grid-template-columns: minmax(380px, 2fr) minmax(120px, .5fr) minmax(180px, .65fr) auto;
      align-items: center;
      gap: 18px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .account:last-child { border-bottom: 0; }
    .account:hover { background: var(--surface-hover); }
    .identity { min-width: 0; }
    .identity-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .account-name { overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .plan-label {
      flex: none;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--muted);
      padding: 1px 7px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .name-button {
      flex: none;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 6px;
      font-size: 12px;
      font-weight: 650;
    }
    .name-button:hover { background: var(--surface-muted); color: var(--text); }
    .meta {
      overflow: hidden;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .name-editor { display: flex; align-items: center; gap: 7px; }
    .name-editor input {
      width: min(280px, 100%);
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface-muted);
      color: var(--text);
      padding: 6px 9px;
    }

    .usage { max-width: 480px; margin-top: 12px; }
    .usage-window + .usage-window { margin-top: 10px; }
    .usage-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
    }
    .usage-label { color: var(--text); font-weight: 650; }
    .usage-value { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .usage-track {
      width: 100%;
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--track);
    }
    .usage-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .25s ease;
    }
    .usage-fill.warning { background: var(--warning); }
    .usage-fill.danger { background: var(--danger); }
    .usage-note { margin-top: 5px; color: var(--faint); font-size: 11px; }
    .usage-loading {
      width: 72%;
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: linear-gradient(90deg, #252b28 25%, #353d39 50%, #252b28 75%);
      background-size: 200% 100%;
      animation: usage-loading 1.2s linear infinite;
    }
    @keyframes usage-loading { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) {
      .usage-fill { transition: none; }
      .usage-loading { animation: none; }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      border: 1px solid #2d6d57;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #69dbb3;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge.disabled { border-color: var(--line); background: var(--surface-muted); color: var(--muted); }
    .badge.error { border-color: var(--danger-border); background: var(--danger-soft); color: var(--danger); }
    .badge.warning { border-color: var(--warning-border); background: var(--warning-soft); color: #edc96e; }

    .priority-control { display: flex; align-items: center; gap: 7px; }
    .priority-control label { color: var(--muted); font-size: 12px; font-weight: 650; }
    .priority-control input {
      width: 68px;
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface-muted);
      color: var(--text);
      padding: 6px 8px;
    }

    .row-actions { display: flex; justify-content: flex-end; gap: 7px; }

    .empty {
      padding: 52px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 16px; }

    .notice {
      display: none;
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 1000;
      width: min(420px, calc(100% - 48px));
      border: 1px solid var(--warning-border);
      border-radius: 8px;
      background: var(--warning-soft);
      color: #edc96e;
      padding: 12px 14px;
      box-shadow: 0 16px 44px rgba(0, 0, 0, .48);
    }

    .notice.visible { display: flex; align-items: flex-start; gap: 10px; }
    .notice.error { border-color: var(--danger-border); background: var(--danger-soft); color: var(--danger); }
    .notice.success { border-color: #2d6d57; background: var(--accent-soft); color: #69dbb3; }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 24px;
      color: var(--muted);
      font-size: 12px;
    }

    .footer a { color: var(--muted); text-underline-offset: 3px; }

    dialog {
      width: min(440px, calc(100% - 32px));
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      padding: 0;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .58);
    }

    dialog::backdrop { background: rgba(0, 0, 0, .68); backdrop-filter: blur(2px); }
    .dialog-body { padding: 24px; }
    .dialog-body h2 { margin-bottom: 8px; }
    .dialog-body p { margin: 0 0 18px; color: var(--muted); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .device-field { margin: 18px 0; }
    .device-field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .copy-row { display: flex; gap: 8px; }
    .copy-row input {
      min-width: 0;
      flex: 1;
      height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface-muted);
      color: var(--text);
      padding: 9px 10px;
    }
    .copy-row input:disabled { opacity: .8; }
    .copy-value {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface-muted);
      color: var(--text);
      padding: 9px 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .device-code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 22px; font-weight: 700; letter-spacing: .08em; }
    .device-status { min-height: 24px; margin-top: 16px; color: var(--muted); font-size: 13px; }

    dialog.vault-dialog { width: min(1180px, calc(100% - 32px)); }
    .vault-heading p { margin-bottom: 0; }
    .vault-grid { display: grid; gap: 16px; margin-top: 20px; }
    .vault-field { min-width: 0; }
    .vault-field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .vault-field input {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface-muted);
      color: var(--text);
      padding: 9px 10px;
    }
    .vault-field input { height: 40px; }
    .vault-status { min-height: 18px; margin-top: 10px; color: var(--faint); font-size: 11px; }
    .vault-status.error { color: var(--danger); }
    .vault-footer { display: flex; justify-content: flex-end; margin-top: 22px; }
    .vault-footer-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

    .manage-section { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 18px; }
    .manage-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .manage-head-actions { display: flex; flex: none; gap: 8px; }
    .manage-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; align-items: start; }
    .skeleton-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 20px; }
    .skeleton { display: grid; gap: 14px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); padding: 20px 21px 18px; }
    .skeleton-line {
      height: 14px;
      border-radius: 7px;
      background: linear-gradient(90deg, #252b28 25%, #353d39 50%, #252b28 75%);
      background-size: 200% 100%;
      animation: usage-loading 1.2s linear infinite;
    }
    @media (max-width: 1080px) { .skeleton-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 680px) { .skeleton-grid { grid-template-columns: 1fr; gap: 13px; } }
    .icon-button {
      display: inline-grid;
      flex: none;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }
    .icon-button:hover { background: var(--surface-muted); color: var(--text); }
    .icon-button .icon { width: 16px; height: 16px; }
    .manage-title { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
    .manage-desc { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
    .manage-grid { display: grid; grid-template-columns: 1fr 130px; gap: 12px; }
    .manage-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .manage-confirm { display: grid; gap: 10px; margin-top: 12px; border: 1px solid var(--warning-border); border-radius: 8px; background: var(--warning-soft); padding: 12px 14px; }
    .manage-confirm.danger { border-color: var(--danger-border); background: var(--danger-soft); }
    .manage-confirm-title { margin: 0; font-size: 13px; font-weight: 700; color: #edc96e; }
    .manage-confirm.danger .manage-confirm-title { color: var(--danger); }
    .manage-confirm-detail { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .manage-state { color: var(--muted); font-size: 13px; }
    .manage-state strong { color: var(--text); }

    .hidden { display: none !important; }

    @media (max-width: 780px) {
      .shell { width: min(100% - 22px, 620px); padding-top: 24px; }
      .topbar { flex-direction: column; }
      .actions { width: 100%; justify-content: flex-start; }
      .actions .button { flex: 1; }
      .statusbar { grid-template-columns: 1fr 1fr; }
      .metric { padding: 14px 12px; }
      .metric:first-child { grid-column: 1 / -1; padding-left: 12px; border-bottom: 1px solid var(--line); }
      .metric:nth-child(2) { padding-left: 12px; }
      .metric:nth-child(2n) { border-right: 0; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .search-control { grid-column: 1 / -1; }
      .result-count { align-self: center; text-align: left; }
      .account { grid-template-columns: 1fr auto; gap: 13px; }
      .identity { grid-column: 1 / -1; }
      .name-editor { flex-wrap: wrap; }
      .priority-control { justify-content: flex-start; }
      .row-actions { grid-column: 1 / -1; justify-content: flex-start; }
      .row-actions .button { flex: 1; }
      .footer { flex-direction: column; gap: 6px; }
      .notice { right: 11px; bottom: max(11px, env(safe-area-inset-bottom)); width: calc(100% - 22px); }
      .vault-footer { align-items: stretch; flex-direction: column; }
      .vault-footer-actions { justify-content: stretch; }
      .vault-footer-actions .button { flex: 1; }
    }
  </style>
  <style>
    /* Product polish: keep the existing API-driven page, but give it a clearer dashboard rhythm. */
    :root {
      --canvas: #101212;
      --surface: #171a19;
      --surface-muted: #1d2120;
      --surface-hover: #1b1f1e;
      --text: #f1f3f2;
      --muted: #a5adaa;
      --faint: #78817d;
      --line: #2b302e;
      --line-strong: #414946;
      --accent: #78b8a0;
      --accent-hover: #8ac8af;
      --accent-soft: #20352d;
      --on-accent: #0e1713;
      --shadow: 0 2px 8px rgba(0, 0, 0, .16);
    }
    body { background: var(--canvas); }
    .shell { width: min(1440px, calc(100% - 56px)); padding-top: 32px; }
    .topbar { align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom-color: var(--line); }
    .title-group { display: flex; align-items: center; gap: 12px; }
    .page-title { margin: 0 auto 0 0; color: var(--text); font-size: 24px; font-weight: 700; letter-spacing: -.025em; }
    .service-indicator { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .service-indicator .dot.ok { animation: service-pulse 2s ease-out infinite; }
    @keyframes service-pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); } 50% { box-shadow: 0 0 0 5px transparent; } }
    @media (prefers-reduced-motion: reduce) { .service-indicator .dot.ok { animation: none; } }
    .eyebrow { display: flex; align-items: center; gap: 8px; letter-spacing: .1em; }
    .brand-mark { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; color: var(--on-accent); background: var(--accent); font-size: 13px; letter-spacing: 0; }
    h1 { font-size: clamp(30px, 3.8vw, 42px); letter-spacing: -.035em; }
    .header-context { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--faint); font-size: 12px; font-weight: 600; }
    .context-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .context-separator, .footer-separator { color: var(--line-strong); }
    .actions { align-items: center; }
    .button { border-radius: 8px; border-color: var(--line-strong); box-shadow: none; transition: background .15s ease, border-color .15s ease; }
    .button:hover { border-color: var(--accent); transform: none; }
    .button:active { transform: none; }
    .button.primary { box-shadow: none; }
    .statusbar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin: 20px 0 28px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .metric { min-height: 82px; padding: 15px 18px; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: var(--surface); box-shadow: none; }
    .metric:first-child { padding-left: 18px; }
    .metric-label { text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }
    .metric-value { margin-top: 6px; font-size: 22px; }
    .section-head { margin-bottom: 10px; }
    h2 { font-size: 21px; letter-spacing: -.025em; }
    .hint { margin-top: 5px; }
    .toolbar { grid-template-columns: minmax(320px, 1fr) 190px 190px auto auto; gap: 10px; margin: 20px 0 14px; }
    .control input, .control select { border-radius: 10px; background: var(--surface); }
    .control input:focus, .control select:focus, .priority-control input:focus, .name-editor input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(120, 184, 160, .18); outline: none; }
    .clear-filters { min-height: 42px; padding-inline: 12px; color: var(--muted); font-size: 13px; }
    .result-count { min-width: 80px; font-size: 12px; }
    .account-list { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: none; overflow: visible; }

    /* Quota board: a compact, scan-friendly card layout for provider accounts. */
    :root {
      --canvas: #111312;
      --surface: #1d1b18;
      --surface-muted: #262421;
      --surface-hover: #211f1c;
      --text: #f3f0eb;
      --muted: #aaa59e;
      --faint: #7d7871;
      --line: #393732;
      --line-strong: #504d46;
      --accent: #f0c858;
      --accent-hover: #f7d875;
      --accent-soft: #342d1d;
      --on-accent: #1a160c;
      --track: #343431;
    }
    body { background: var(--canvas); }
    .topbar { display: none; }
    .shell { width: calc(100% - 40px); max-width: 1480px; padding: 20px 0 28px; }
    .board-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .provider-nav {
      display: flex;
      align-items: stretch;
      gap: 6px;
      overflow-x: auto;
      flex: 1 1 auto;
      max-width: 900px;
      margin: 0;
      border-bottom: 1px solid var(--line);
      scrollbar-width: thin;
    }
    .provider-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0 15px;
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
    }
    .provider-tab:hover { color: var(--text); }
    .provider-tab.active { border-bottom-color: var(--accent); color: var(--text); }
    .provider-tab:disabled { cursor: default; opacity: .52; }
    .provider-count {
      display: inline-grid;
      min-width: 21px;
      height: 21px;
      place-items: center;
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .provider-tab.active .provider-count { background: var(--accent-soft); color: var(--accent); }
    .provider-glyph {
      display: inline-grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 6px;
      background: var(--surface-muted);
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }
    .board-toolbar { display: none; }
    .board-actions { display: flex; flex: none; align-items: center; gap: 8px; }
    .board-actions .button { min-height: 40px; padding: 8px 14px; font-size: 13px; white-space: nowrap; }
    .statusbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; margin: 16px 0 0; padding: 11px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .statusbar .metric { display: flex; align-items: baseline; gap: 8px; min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    .statusbar .metric:first-child { padding-left: 0; border-bottom: 0; }
    .statusbar .metric:nth-child(n) { border: 0; }
    .statusbar .metric-label { font-size: 12px; text-transform: none; letter-spacing: 0; }
    .statusbar .metric-value { margin-top: 0; font-size: 15px; }
    .account-list { border: 0; background: transparent; box-shadow: none; overflow: visible; }
    .account-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 20px; }
    .account-card {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: stretch;
      text-align: left;
      cursor: pointer;
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
      padding: 20px 21px 18px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .13);
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .account-card:hover { border-color: var(--line-strong); background: var(--surface-hover); transform: translateY(-1px); }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; width: 100%; }
    .card-identity { display: flex; min-width: 0; flex: 1 1 auto; align-items: center; gap: 11px; }
    .card-identity .identity { flex: 1 1 auto; min-width: 0; }
    .provider-glyph.card-glyph { width: 30px; height: 30px; flex: none; border-radius: 9px; background: var(--accent-soft); font-size: 16px; }
    .card-glyph { color: #70d2ae; background: #15372e !important; }
    .card-name { overflow: hidden; width: 100%; color: var(--text); font-size: 16px; font-weight: 700; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .card-subtitle { overflow: hidden; margin-top: 3px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .card-head .menu-wrap { flex: none; }
    .card-head .menu-toggle { min-width: 34px; width: 34px; height: 34px; padding: 0; }
    .card-head .menu-toggle .icon { width: 16px; height: 16px; }
    .card-details { display: flex; align-items: center; justify-content: flex-start; gap: 9px; width: 100%; color: var(--muted); font-size: 13px; text-align: left; }
    .card-details strong { color: var(--text); font-size: 14px; }
    .card-quota { display: grid; gap: 13px; width: 100%; }
    .card-quota .usage { margin: 0; width: 100%; max-width: none; }
    .card-quota .usage-window { width: 100%; }
    .card-quota .usage-window + .usage-window { margin-top: 13px; }
    .card-quota .usage-head { display: flex; justify-content: space-between; width: 100%; margin-bottom: 6px; font-size: 13px; align-items: baseline; }
    .card-quota .usage-track { width: 100%; }
    .card-quota .usage-label { color: var(--text); font-weight: 600; }
    .card-quota .usage-value { color: var(--text); font-weight: 700; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
    .card-quota .usage-reset { color: var(--muted); font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
    .card-quota .usage-note { margin-top: 4px; }
    .logs-panel { margin-top: 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
    .logs-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .logs-title { margin: 0; font-size: 16px; }
    .logs-actions { display: flex; gap: 8px; }
    .logs-output { margin: 0; padding: 16px 18px; min-height: 180px; max-height: min(560px, 62vh); overflow: auto; color: var(--muted); background: #0a0c0b; font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; tab-size: 2; }
    .logs-output .error { color: var(--danger); }
    .logs-panel { scroll-margin-top: 18px; }
    @media (max-width: 680px) { .logs-head { align-items: stretch; flex-direction: column; } .logs-actions { width: 100%; } .logs-actions .button { flex: 1; } .logs-output { padding: 12px; font-size: 11px; } }
    .card-footer { display: flex; align-items: center; justify-content: flex-end; gap: 10px; width: 100%; margin-top: auto; padding-top: 10px; }
    .card-footer .badge { margin-right: auto; }
    .card-footer .account-status { display: flex; min-width: 0; flex-wrap: wrap; gap: 6px; }
    .refresh-account { min-height: 36px; border-radius: 999px; padding-inline: 13px; }
    .card-edit { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .card-edit input { width: min(190px, 100%); height: 36px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface-muted); color: var(--text); padding: 6px 9px; }
    .empty { min-height: 260px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
    .account-card > .meta, .account-card > .priority-summary { display: none; }
    @media (max-width: 1080px) { .account-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, 620px); }
      .board-head { align-items: stretch; flex-direction: column; gap: 12px; }
      .board-actions { width: 100%; }
      .board-actions .button { flex: 1; justify-content: center; }
      .provider-nav { max-width: none; margin-inline: -4px; }
      .provider-tab { padding-inline: 11px; }
      .board-toolbar { align-items: stretch; flex-direction: column; }
      .account-grid { grid-template-columns: 1fr; gap: 13px; }
      .account-card { min-height: 0; padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="title-group">
        <h1 class="page-title">Account quota board</h1>

    <div class="notice" id="notice" role="status" aria-live="polite"></div>

    <section class="statusbar" aria-label="Proxy summary">
      <div class="metric">

      </div>
      <div class="metric">

  </main>

  <dialog class="vault-dialog" id="accountDialog">

  <script>
    const API = "/v0/accounts";
    const state = {
      accounts: [],
      quotas: {},
      activeProvider: "codex",
      refreshing: new Set(),
      resetting: new Set(),
      manageAccount: null,
      pendingConfirm: null,
      loading: false
    };
    const accountList = document.getElementById("accountList");
    const notice = document.getElementById("notice");

    const providerNames = {
      all: "All",
      claude: "Claude",
      antigravity: "Antigravity",
      codex: "Codex",
      xai: "xAI",
      kimi: "Kimi",
      gemini: "Gemini",
      openai: "OpenAI"
    };
    const providerGlyphs = { all: "⌘", claude: "✳", antigravity: "▲", codex: "▣", xai: "◒", kimi: "K", gemini: "✦", openai: "◎" };

    function providerKey(account) {
      const value = String(account?.provider || account?.type || "other").trim().toLowerCase();
      return value || "other";
    }

    function providerLabel(key) {
      return providerNames[key] || key.charAt(0).toUpperCase() + key.slice(1);
    }

    function isCodex(account) { return providerKey(account) === "codex"; }

    function renderProviderNav() {
      const nav = document.getElementById("providerNav");
      const counts = state.accounts.reduce((result, account) => {
        const key = providerKey(account);
        result[key] = (result[key] || 0) + 1;
        return result;
      }, {});
      const keys = ["all", ...Object.keys(counts).sort((left, right) => providerLabel(left).localeCompare(providerLabel(right)))];
      if (!state.accounts.length || (!counts.codex && state.accounts.length)) state.activeProvider = "all";
      if (!keys.includes(state.activeProvider)) state.activeProvider = keys[0] || "all";
      nav.innerHTML = keys.map(key => {
        const count = key === "all" ? state.accounts.length : (counts[key] || 0);
        const active = state.activeProvider === key;
        return `<button class="provider-tab${active ? " active" : ""}" type="button" data-provider="${escapeHTML(key)}" aria-pressed="${active}" ${count ? "" : "disabled"}><span class="provider-glyph">${escapeHTML(providerGlyphs[key] || "•")}</span>${escapeHTML(providerLabel(key))}<span class="provider-count">${count}</span></button>`;
      }).join("");
    }

    function visibleAccounts() {
      return state.activeProvider === "all" ? state.accounts : state.accounts.filter(account => providerKey(account) === state.activeProvider);
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[character]);
    }

    async function request(path, options = {}) {
      const headers = new Headers(options.headers || {});
      if (options.body) headers.set("Content-Type", "application/json");
      const response = await fetch(API + path, { ...options, headers });
      let body = {};
      try { body = await response.json(); } catch (_) {}
      if (!response.ok) {
        const error = new Error(body.error || `Request failed (${response.status})`);
        error.status = response.status;
        throw error;
      }
      return body;
    }

    async function vaultRequest(path, options = {}) {
      return request("/vault" + path, options);
    }

    function showNotice(message, type = "") {
      notice.className = "notice visible" + (type ? " " + type : "");
      notice.textContent = message;
      window.clearTimeout(showNotice.timer);
      showNotice.timer = window.setTimeout(() => notice.className = "notice", 6000);
    }

    function statusBadge(account) {
      const quota = state.quotas[account.name];
      if (account.disabled) return '<span class="badge disabled">Disabled</span>';
      if (quota?.status === "success") {
        if (quota.data.limit_reached || accountUsage(account) >= 100) return '<span class="badge warning">Limit hit</span>';
        return '<span class="badge">Active</span>';
      }
      if (account.failed || account.unavailable || account.status === "error") return '<span class="badge error">Unavailable</span>';
      return '<span class="badge">Active</span>';
    }

    function resetAvailabilityBadge(account) {
      const quota = state.quotas[account.name];
      const count = quota?.status === "success" ? Math.max(0, Number(quota.data.reset_credits || 0)) : 0;
      if (!count) return "";
      return `<span class="badge warning">${count} reset${count === 1 ? "" : "s"} available</span>`;
    }

    function formatResetAbsolute(resetAt) {
      const seconds = Number(resetAt || 0);
      if (!seconds) return "";
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Karachi",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      }).formatToParts(new Date(seconds * 1000));
      const get = type => parts.find(part => part.type === type)?.value || "";
      return `${get("month")}/${get("day")}, ${get("hour")}:${get("minute")} ${get("dayPeriod")}`.trim();
    }

    function formatResetRelative(resetAt) {
      const seconds = Math.max(0, Number(resetAt || 0) - Math.floor(Date.now() / 1000));
      if (!seconds) return "";
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(seconds / 3600);
      const days = Math.floor(seconds / 86400);
      if (days >= 1) return `in ${days} day${days === 1 ? "" : "s"}`;
      if (hours >= 1) return `in ${hours} hour${hours === 1 ? "" : "s"}`;
      if (minutes >= 1) return `in ${minutes} minute${minutes === 1 ? "" : "s"}`;
      return "in less than a minute";
    }

    function formatResetTime(resetAt) {
      const absolute = formatResetAbsolute(resetAt);
      const relative = formatResetRelative(resetAt);
      if (absolute && relative) return `${absolute}  ·  ${relative}`;
      if (absolute) return absolute;
      if (relative) return relative;
      return "Reset time unavailable";
    }

    function quotaMarkup(account) {
      const quota = state.quotas[account.name];
      if (!quota || quota.status === "loading") {
        return '<div class="usage" aria-label="Loading usage"><div class="usage-loading"></div></div>';
      }
      if (quota.status === "error") {
        return '<div class="usage"><div class="usage-note">Usage temporarily unavailable</div></div>';
      }
      if (!quota.data.windows?.length) {
        return '<div class="usage"><div class="usage-note">No usage window reported</div></div>';
      }
      return `<div class="usage">${quota.data.windows.map(window => {
        const used = Math.max(0, Math.min(100, Number(window.used_percent || 0)));
        const tone = used >= 90 ? "danger" : used >= 70 ? "warning" : "";
        const reset = formatResetTime(window.reset_at);
        return `
          <div class="usage-window">
            <div class="usage-head">
              <span class="usage-label">${escapeHTML(window.label)}</span>
              <span class="usage-value">${Math.round(used)}%<span class="usage-reset">${escapeHTML(reset)}</span></span>
            </div>
            <div class="usage-track" role="progressbar" aria-label="${escapeHTML(window.label)} usage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${used}">
              <div class="usage-fill ${tone}" style="width:${used}%"></div>
            </div>
          </div>
        `;
      }).join("")}</div>`;
    }

    function accountUsage(account) {
      const quota = state.quotas[account.name];
      const windows = quota?.status === "success" ? quota.data.windows || [] : [];
      if (!windows.length) return null;
      return Math.max(...windows.map(window => Math.max(0, Math.min(100, Number(window.used_percent || 0)))));
    }

    function usageState(account) {
      if (!isCodex(account)) return account.disabled ? "unavailable" : "not-used";
      const usage = accountUsage(account);
      if (usage === null) {
        return state.quotas[account.name]?.status === "loading" ? "loading" : "unavailable";
      }
      if (usage >= 100) return "limit-hit";
      if (usage > 0) return "in-use";
      return "not-used";
    }

    function accountDisplayName(account) {
      return String(account.note || account.email || account.label || "Codex account").trim();
    }

    function subscriptionStatus(account) {
      const raw = account.id_token?.chatgpt_subscription_active_until;
      if (!raw) return "Subscription end unavailable";
      const end = new Date(raw);
      if (Number.isNaN(end.getTime())) return "Subscription end unavailable";

      const exactTime = end.toLocaleString(undefined, {
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZone: "Asia/Karachi"
      });
      const pakistanTime = `${exactTime} PKT`;
      const remaining = end.getTime() - Date.now();
      if (remaining <= 0) return `Subscription ended ${pakistanTime}`;
      const totalMinutes = Math.max(1, Math.floor(remaining / 60000));
      const days = Math.floor(totalMinutes / 1440);
      const hours = Math.floor((totalMinutes % 1440) / 60);
      const minutes = totalMinutes % 60;
      const timeLeft = days ? `${days}d ${hours}h` : hours ? `${hours}h ${minutes}m` : `${minutes}m`;
      return `Subscription ends ${pakistanTime} · ${timeLeft} left`;
    }

    function friendlyStatusMessage(account) {
      const raw = String(account.status_message || "").trim();
      if (!raw) return "Ready for requests";

      let type = "";
      let message = raw;
      try {
        const parsed = JSON.parse(raw);
        const error = parsed?.error || parsed;
        type = String(error?.type || error?.code || "").trim();
        message = String(error?.message || error?.error || raw).trim();
      } catch (_) {}

      if (type === "usage_limit_reached" || raw.includes("usage_limit_reached")) {
        return "Usage limit reached";
      }
      return message.length > 120 ? message.slice(0, 117) + "…" : message;
    }

    function renderStats() {
      const list = visibleAccounts();
      const states = list.map(usageState);
      document.getElementById("totalCount").textContent = list.length;
      document.getElementById("readyCount").textContent = list.filter((account, index) => !account.disabled && states[index] !== "limit-hit" && states[index] !== "unavailable" && states[index] !== "loading").length;
      document.getElementById("limitHitCount").textContent = states.filter(value => value === "limit-hit").length;
      document.getElementById("resetAvailableCount").textContent = list.reduce((total, account) => {
        const quota = state.quotas[account.name];
        return total + (quota?.status === "success" ? Math.max(0, Number(quota.data.reset_credits || 0)) : 0);
      }, 0);
    }

    function renderAccounts() {
      renderProviderNav();
      const accounts = [...visibleAccounts()].sort((left, right) =>
        accountDisplayName(left).localeCompare(accountDisplayName(right), undefined, { sensitivity: "base", numeric: true })
      );
      renderStats();
      if (!accounts.length) {
        if (state.loading) {
          const skeletonCard = `<div class="skeleton" aria-hidden="true"><div class="skeleton-line" style="width:42%"></div><div class="skeleton-line" style="width:28%"></div><div class="skeleton-line" style="width:100%"></div><div class="skeleton-line" style="width:100%"></div></div>`;
          accountList.innerHTML = `<div class="skeleton-grid" aria-label="Loading accounts">${skeletonCard.repeat(6)}</div>`;
          return;
        }
        const emptyProvider = providerLabel(state.activeProvider);
        accountList.innerHTML = `<div class="empty"><strong>No ${escapeHTML(emptyProvider)} accounts yet</strong><span>Connect an account to start routing requests through your proxy.</span><button class="button primary empty-add" id="emptyAdd" type="button"><svg class="icon" aria-hidden="true"><use href="#plus"></use></svg>Connect first account</button></div>`;
        return;
      }
      accountList.innerHTML = `<div class="account-grid">${accounts.map(account => {
        const name = escapeHTML(account.name);
        const email = escapeHTML(account.email || account.label || `${providerLabel(providerKey(account))} account`);
        const accountName = String(account.note || "").trim();
        const displayName = escapeHTML(accountName || account.email || account.label || `${providerLabel(providerKey(account))} account`);
        const reportedPlan = state.quotas[account.name]?.status === "success" ? state.quotas[account.name].data.plan_type : "";
        const rawPlan = String(reportedPlan || account.id_token?.plan_type || account.account_type || "ChatGPT").trim();
        const planName = rawPlan ? rawPlan.charAt(0).toUpperCase() + rawPlan.slice(1).toLowerCase() : "ChatGPT";
        const plan = escapeHTML(planName);
        const planLabel = rawPlan.toLowerCase() === "free" ? '<span class="plan-label">Free</span>' : "";
        const priority = Number.isInteger(account.priority) ? account.priority : 0;
        const isRefreshing = state.refreshing.has(account.name);
        const subscription = escapeHTML(subscriptionStatus(account));
        const glyph = providerGlyphs[providerKey(account)] || "•";
        return `
          <article class="account account-card" data-name="${name}" tabindex="0" role="button" aria-label="Manage ${displayName}">
            <div class="card-head">
              <div class="card-identity">
                <span class="provider-glyph card-glyph">${escapeHTML(glyph)}</span>
                <div class="identity">
                  <div class="card-name" title="${displayName} · ${email}">${displayName}</div>
                </div>
              </div>
            </div>
            <div class="card-details"><span>Plan</span><strong>${plan}</strong>${planLabel}</div>
            <div class="card-quota">${isCodex(account) ? quotaMarkup(account) : '<div class="usage"><div class="usage-note">Usage is managed by this provider.</div></div>'}</div>
            <div class="card-footer">${account.disabled ? '<span class="badge disabled">Disabled</span>' : ""}<button class="button small refresh-account" type="button" ${isRefreshing || !isCodex(account) ? "disabled" : ""} aria-label="Refresh usage for ${email}"><svg class="icon" aria-hidden="true"><use href="#refresh"></use></svg>${isRefreshing ? "Refreshing…" : "Refresh quota"}</button></div>
            <div class="meta">${subscription}</div>
            <div class="priority-summary">Priority <strong>${priority}</strong></div>
          </article>
        `;
      }).join("")}</div>`;
    }

    async function loadAccounts() {
      if (state.loading) return;
      state.loading = true;
      const refreshButton = document.getElementById("refreshButton");
      refreshButton.disabled = true;
      refreshButton.setAttribute("aria-busy", "true");
      try {
        const [authData, healthResponse] = await Promise.all([
          request("/auth-files"),
          fetch("/healthz")
        ]);
        state.accounts = authData.files || [];
        state.quotas = Object.fromEntries(state.accounts.filter(isCodex).map(account => [account.name, { status: "loading" }]));
        renderAccounts();
        const online = healthResponse.ok;
        document.getElementById("serviceStatus").textContent = online ? "Online" : "Unavailable";
        document.getElementById("serviceDot").classList.toggle("ok", online);
        await Promise.allSettled(state.accounts.filter(isCodex).map(async account => {
          try {
            const data = await request("/quota?auth_index=" + encodeURIComponent(account.auth_index));
            state.quotas[account.name] = { status: "success", data };
          } catch (error) {
            state.quotas[account.name] = { status: "error", error: error.message };
          }
          renderAccounts();
        }));
      } finally {
        refreshButton.disabled = false;
        refreshButton.removeAttribute("aria-busy");
        state.loading = false;
      }
    }

    const manageFieldIds = ["manageName", "managePriority", "manageEmail", "managePassword", "manageTOTPSecret"];

    function setManageMode(mode) {
      const editing = mode === "edit";
      for (const id of manageFieldIds) {
        document.getElementById(id).disabled = !editing;
      }
      document.getElementById("saveManageAll").classList.toggle("hidden", !editing);
      document.getElementById("toggleManageEditIcon").setAttribute("href", editing ? "#x" : "#pencil");
      document.getElementById("toggleManageEdit").setAttribute("aria-label", editing ? "Stop editing" : "Edit details");
    }

    async function copyManageField(button) {
      const target = document.getElementById(button.dataset.copyTarget || "");
      const value = target ? target.value : "";
      if (!value) return;
      try {
        await navigator.clipboard.writeText(value);
      } catch (_) {
        const helper = document.createElement("textarea");
        helper.value = value;
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        helper.remove();
      }
      const previous = button.textContent;
      button.textContent = "Copied";
      window.setTimeout(() => button.textContent = previous, 1200);
    }

    function manageTarget() {
      if (!state.manageAccount) return null;
      return state.accounts.find(item => item.name === state.manageAccount) || null;
    }

    function manageResetCredits(account) {
      const quota = state.quotas[account.name];
      return quota?.status === "success" ? Math.max(0, Number(quota.data.reset_credits || 0)) : 0;
    }

    function setManageStatus(elementId, message, type = "") {
      const status = document.getElementById(elementId);
      status.textContent = message;
      status.className = "vault-status" + (type ? " " + type : "");
    }

    function refreshManageStatusSection() {
      const account = manageTarget();
      if (!account) return;
      const toggle = document.getElementById("toggleManageAccount");
      toggle.textContent = account.disabled ? "Enable account" : "Disable account";
      const credits = manageResetCredits(account);
      const resetButton = document.getElementById("useManageReset");
      resetButton.disabled = !credits || state.resetting.has(account.name);
      resetButton.textContent = state.resetting.has(account.name)
        ? "Using reset…"
        : credits ? `Use limit reset (${credits})` : "Use limit reset";
    }

    function clearManageConfirm() {
      state.pendingConfirm = null;
      document.getElementById("manageConfirm").classList.add("hidden");
    }

    function askManageConfirm({ title, detail, danger, action }) {
      state.pendingConfirm = action;
      document.getElementById("manageConfirmTitle").textContent = title;
      document.getElementById("manageConfirmDetail").textContent = detail;
      document.getElementById("manageConfirm").classList.toggle("danger", !!danger);
      document.getElementById("confirmManageAction").classList.toggle("danger", !!danger);
      document.getElementById("confirmManageAction").disabled = false;
      document.getElementById("manageConfirm").classList.remove("hidden");
    }

    async function openAccountDialog(account) {
      state.manageAccount = account.name;
      clearManageConfirm();
      document.getElementById("manageAccountSubtitle").textContent =
        `${accountDisplayName(account)} · ${account.email || account.label || providerLabel(providerKey(account))}`;
      document.getElementById("manageName").value = String(account.note || "");
      document.getElementById("managePriority").value = Number.isInteger(account.priority) ? account.priority : 0;
      setManageStatus("manageSaveStatus", "");
      setManageStatus("manageStatusMessage", "");
      document.getElementById("manageEmail").value = account.email || "";
      document.getElementById("managePassword").value = "";
      document.getElementById("manageTOTPSecret").value = "";
      refreshManageStatusSection();
      setManageMode("view");
      const dialog = document.getElementById("accountDialog");
      if (!dialog.open) dialog.showModal();
      try {
        const metadata = await vaultRequest("?auth_index=" + encodeURIComponent(account.auth_index));
        if (state.manageAccount !== account.name) return;
        document.getElementById("manageEmail").value = metadata.email || account.email || "";
        document.getElementById("managePassword").value = metadata.password || "";
        document.getElementById("manageTOTPSecret").value = metadata.totp_secret || "";
        setManageStatus("manageSaveStatus", metadata.exists ? "Credentials are saved locally." : "No credentials saved yet.");
      } catch (error) {
        if (state.manageAccount !== account.name) return;
        setManageStatus("manageSaveStatus", error.message, "error");
      }
    }

    function scrubManageSecrets() {
      for (const id of ["managePassword", "manageTOTPSecret"]) {
        const element = document.getElementById(id);
        if (element) element.value = "";
      }
    }

    function closeAccountDialog() {
      scrubManageSecrets();
      state.manageAccount = null;
      clearManageConfirm();
      const dialog = document.getElementById("accountDialog");
      if (dialog.open) dialog.close();
    }

    async function saveManageAll() {
      const account = manageTarget();
      if (!account) return;
      const priority = Number(document.getElementById("managePriority").value);
      if (!Number.isInteger(priority)) {
        setManageStatus("manageSaveStatus", "Priority must be a whole number.", "error");
        return;
      }
      const saveButton = document.getElementById("saveManageAll");
      saveButton.disabled = true;
      setManageStatus("manageSaveStatus", "Saving changes…");
      try {
        await request("/auth-files/fields", {
          method: "PATCH",
          body: JSON.stringify({
            name: account.name,
            note: document.getElementById("manageName").value.trim(),
            priority
          })
        });
        await vaultRequest("", {
          method: "PUT",
          body: JSON.stringify({
            auth_index: account.auth_index,
            email: document.getElementById("manageEmail").value,
            password: document.getElementById("managePassword").value,
            totp_secret: document.getElementById("manageTOTPSecret").value
          })
        });
        setManageStatus("manageSaveStatus", "All changes saved.");
        showNotice(`Account saved for ${accountDisplayName(account)}.`, "success");
        setManageMode("view");
        await refreshSingleAccount(account);
      } catch (error) {
        setManageStatus("manageSaveStatus", error.message, "error");
      } finally {
        saveButton.disabled = false;
      }
    }

    async function toggleManageAccount() {
      const account = manageTarget();
      if (!account) return;
      if (account.disabled) {
        try {
          await toggleAccount(account);
          refreshManageStatusSection();
        } catch (error) {
          setManageStatus("manageStatusMessage", error.message, "error");
        }
        return;
      }
      askManageConfirm({
        title: `Disable ${accountDisplayName(account)}?`,
        detail: "It will be skipped for requests until you enable it again.",
        danger: false,
        action: async () => {
          await toggleAccount(account);
          clearManageConfirm();
          refreshManageStatusSection();
        }
      });
    }

    async function resetManageLimits() {
      const account = manageTarget();
      const credits = account ? manageResetCredits(account) : 0;
      if (!account || !credits) return;
      askManageConfirm({
        title: `Use a limit reset for ${accountDisplayName(account)}?`,
        detail: `Uses 1 of ${credits} available reset${credits === 1 ? "" : "s"}. This cannot be undone.`,
        danger: true,
        action: async () => {
          state.resetting.add(account.name);
          refreshManageStatusSection();
          try {
            await request("/reset-quota", {
              method: "POST",
              body: JSON.stringify({ auth_index: account.auth_index })
            });
            showNotice(`Limit reset used for ${accountDisplayName(account)}.`, "success");
            clearManageConfirm();
            await refreshSingleAccount(account);
          } finally {
            state.resetting.delete(account.name);
            refreshManageStatusSection();
          }
        }
      });
    }

    async function removeManageAccount() {
      const account = manageTarget();
      if (!account) return;
      askManageConfirm({
        title: `Remove ${accountDisplayName(account)}?`,
        detail: "The local OAuth credential will be deleted. You can add the account again later.",
        danger: true,
        action: async () => {
          await deleteAccount(account);
          closeAccountDialog();
        }
      });
    }

    async function refreshAccount(account) {
      state.refreshing.add(account.name);
      renderAccounts();
      try {
        const data = await request("/quota?auth_index=" + encodeURIComponent(account.auth_index));
        state.quotas[account.name] = { status: "success", data };
        showNotice(`Usage refreshed for ${accountDisplayName(account)}.`, "success");
      } finally {
        state.refreshing.delete(account.name);
        renderAccounts();
      }
    }

    async function refreshSingleAccount(account) {
      const name = typeof account === "string" ? account : account.name;
      const cached = state.accounts.find(item => item.name === name);
      const authIndex = (typeof account === "string" ? cached?.auth_index : account.auth_index) || "";
      try {
        const authData = await request("/auth-files?name=" + encodeURIComponent(name) +
          (authIndex ? "&auth_index=" + encodeURIComponent(authIndex) : ""));
        const fresh = (authData.files || []).find(item => item.name === name) || (authData.files || [])[0];
        if (fresh) {
          const index = state.accounts.findIndex(item => item.name === name);
          if (index !== -1) state.accounts[index] = fresh;
          else state.accounts.push(fresh);
        }
      } catch (_) {
        // Keep the cached entry; the quota refresh below still runs.
      }
      const target = state.accounts.find(item => item.name === name);
      if (target && isCodex(target)) {
        state.quotas[name] = { status: "loading" };
        renderAccounts();
        try {
          const data = await request("/quota?auth_index=" + encodeURIComponent(target.auth_index));
          state.quotas[name] = { status: "success", data };
        } catch (error) {
          state.quotas[name] = { status: "error", error: error.message };
        }
      }
      renderAccounts();
      if (state.manageAccount === name && target) {
        document.getElementById("manageAccountSubtitle").textContent =
          `${accountDisplayName(target)} · ${target.email || target.label || providerLabel(providerKey(target))}`;
        refreshManageStatusSection();
      }
    }

    async function toggleAccount(account) {
      await request("/auth-files/status", {
        method: "PATCH",
        body: JSON.stringify({ name: account.name, auth_index: account.auth_index, disabled: !account.disabled })
      });
      showNotice(account.disabled ? "Account enabled." : "Account disabled.", "success");
      await refreshSingleAccount(account);
    }

    async function deleteAccount(account) {
      await request("/auth-files?name=" + encodeURIComponent(account.name), { method: "DELETE" });
      showNotice("Account removed.", "success");
      await loadAccounts();
    }

    async function addAccount() {
      document.getElementById("addButton").disabled = true;
      try {
        const result = await request("/codex-device-auth");
        document.getElementById("deviceURL").textContent = result.url;
        document.getElementById("deviceCode").textContent = result.user_code;
        document.getElementById("deviceStatus").textContent = "Waiting for approval...";
        const dialog = document.getElementById("deviceDialog");
        dialog.dataset.state = result.state;
        dialog.showModal();
        const started = Date.now();
        while (Date.now() - started < Number(result.expires_in || 900) * 1000 && dialog.open) {
          await new Promise(resolve => window.setTimeout(resolve, 1500));
          const status = await request("/get-auth-status?state=" + encodeURIComponent(result.state));
          if (status.status === "ok") {
            document.getElementById("deviceStatus").textContent = "Account connected.";
            showNotice("Account connected successfully.", "success");
            await loadAccounts();
            window.setTimeout(() => dialog.close(), 700);
            return;
          }
          if (status.status === "error") throw new Error(status.error || "OAuth login failed");
        }
        if (dialog.open) throw new Error("Login code expired. Please try again.");
      } catch (error) {
        document.getElementById("deviceStatus").textContent = error.message;
        showNotice(error.message, "error");
      } finally {
        document.getElementById("addButton").disabled = false;
      }
    }

    document.getElementById("deviceDialog").addEventListener("click", async event => {
      const copyButton = event.target.closest(".copy-device");
      if (!copyButton) return;
      const value = document.getElementById(copyButton.dataset.copy).textContent;
      try {
        await navigator.clipboard.writeText(value);
      } catch (_) {
        const helper = document.createElement("textarea");
        helper.value = value;
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        helper.remove();
      }
      const previous = copyButton.textContent;
      copyButton.textContent = "Copied";
      window.setTimeout(() => copyButton.textContent = previous, 1200);
    });

    document.getElementById("cancelDeviceButton").addEventListener("click", async () => {
      const dialog = document.getElementById("deviceDialog");
      const authState = dialog.dataset.state;
      dialog.close();
      if (authState) {
        try { await request("/oauth-session?state=" + encodeURIComponent(authState), { method: "DELETE" }); }
        catch (_) {}
      }
    });

    document.getElementById("refreshButton").addEventListener("click", () => {
      loadAccounts().catch(error => showNotice(error.message, "error"));
    });
    document.getElementById("addButton").addEventListener("click", addAccount);

    document.getElementById("providerNav").addEventListener("click", event => {
      const tab = event.target.closest(".provider-tab");
      if (!tab || tab.disabled) return;
      state.activeProvider = tab.dataset.provider || "all";
      renderAccounts();
    });

    window.setInterval(() => {
      if (document.visibilityState === "visible" && !document.querySelector("dialog[open]")) {
        loadAccounts().catch(() => {});
      }
    }, 60000);

    accountList.addEventListener("click", async event => {
      if (event.target.closest("#emptyAdd")) {
        await addAccount();
        return;
      }
      const row = event.target.closest(".account");
      if (!row) return;
      const account = state.accounts.find(item => item.name === row.dataset.name);
      if (!account) return;
      try {
        if (event.target.closest(".refresh-account")) {
          await refreshAccount(account);
          return;
        }
        await openAccountDialog(account);
      } catch (error) {
        showNotice(error.message, "error");
      }
    });

    accountList.addEventListener("keydown", async event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const row = event.target.closest(".account");
      if (!row || event.target.closest("button")) return;
      event.preventDefault();
      const account = state.accounts.find(item => item.name === row.dataset.name);
      if (!account) return;
      try { await openAccountDialog(account); }
      catch (error) { showNotice(error.message, "error"); }
    });

    document.getElementById("saveManageAll").addEventListener("click", async () => {
      try { await saveManageAll(); }
      catch (error) { setManageStatus("manageSaveStatus", error.message, "error"); }
    });

    document.getElementById("toggleManageAccount").addEventListener("click", async () => {
      try { await toggleManageAccount(); }
      catch (error) { setManageStatus("manageStatusMessage", error.message, "error"); }
    });

    document.getElementById("useManageReset").addEventListener("click", async () => {
      try { await resetManageLimits(); }
      catch (error) { setManageStatus("manageStatusMessage", error.message, "error"); }
    });

    document.getElementById("removeManageAccount").addEventListener("click", async () => {
      try { await removeManageAccount(); }
      catch (error) { setManageStatus("manageStatusMessage", error.message, "error"); }
    });

    document.getElementById("cancelManageConfirm").addEventListener("click", clearManageConfirm);

    document.getElementById("confirmManageAction").addEventListener("click", async event => {
      const action = state.pendingConfirm;
      if (!action) return;
      event.currentTarget.disabled = true;
      try { await action(); }
      catch (error) { setManageStatus("manageStatusMessage", error.message, "error"); }
      finally { event.currentTarget.disabled = false; }
    });

    document.getElementById("toggleManageEdit").addEventListener("click", () => {
      const dialog = document.getElementById("accountDialog");
      setManageMode(dialog.dataset.mode === "edit" ? "view" : "edit");
    });

    document.getElementById("accountDialog").addEventListener("click", async event => {
      const copyButton = event.target.closest("[data-copy-target]");
      if (!copyButton) return;
      try { await copyManageField(copyButton); }
      catch (error) { showNotice(error.message, "error"); }
    });

    document.getElementById("closeManage").addEventListener("click", closeAccountDialog);

    document.getElementById("accountDialog").addEventListener("cancel", event => {
      event.preventDefault();
      closeAccountDialog();
    });

    loadAccounts().catch(error => showNotice(error.message, "error"));
    let logsCursor = "";
    let logsPolling = null;
    const logsOutput = document.getElementById("logsOutput");
    const logsPanel = document.getElementById("logsPanel");
    function redactLogLine(line) {
      return line
        .replace(/(authorization\s*[:=]\s*bearer\s+)[^\s,]+/gi, "$1[REDACTED]")
        .replace(/(\b(?:api[-_ ]?key|token|secret|password|cookie)\s*[:=]\s*)[^\s,]+/gi, "$1[REDACTED]")
        .replace(/(sk-[A-Za-z0-9_-]{8,})/g, "[REDACTED]");
    }
    function appendLogs(lines) {
      if (!lines || !lines.length) return;
      const existing = logsOutput.textContent === "Loading logs…" ? "" : logsOutput.textContent;
      const normalized = lines.flatMap(line => String(line).replaceAll("\\\\n", "\\n").split("\\n"));
      const all = (existing ? existing.split("\\n") : []).concat(normalized.map(redactLogLine));
      logsOutput.textContent = all.slice(-2000).join("\\n");
      logsOutput.scrollTop = logsOutput.scrollHeight;
    }
    async function loadLogs(reset = false) {
      try {
        const query = reset || !logsCursor ? "?limit=200" : "?cursor=" + encodeURIComponent(logsCursor) + "&limit=200";
        const data = await request("/logs" + query);
        if (reset || data["cursor-reset"]) logsOutput.textContent = "";
        appendLogs(data.lines || []);
        logsCursor = data["next-cursor"] || logsCursor;
        if (!logsOutput.textContent) logsOutput.textContent = "No logs available.";
      } catch (error) {
        logsOutput.textContent = "Unable to load logs: " + error.message;
      }
    }
    function toggleLogs() {
      const opening = logsPanel.hidden;
      logsPanel.hidden = !opening;
      if (opening) {
        loadLogs(true);
        clearInterval(logsPolling);
        logsPolling = setInterval(() => loadLogs(false), 2000);
        logsPanel.scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        clearInterval(logsPolling);
        logsPolling = null;
      }
    }
    document.getElementById("logsButton").addEventListener("click", toggleLogs);
    document.getElementById("logsRefresh").addEventListener("click", () => loadLogs(true));
    document.getElementById("logsClear").addEventListener("click", async () => {
      if (!confirm("Clear all application logs?")) return;
      try { await request("/logs", { method: "DELETE" }); logsCursor = ""; logsOutput.textContent = "Logs cleared."; }
      catch (error) { logsOutput.textContent = "Unable to clear logs: " + error.message; }
    });
  </script>
</body>
</html>
